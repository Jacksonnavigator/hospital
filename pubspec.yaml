name: qmedco
description: QmedCO — Your Smart Medical Companion.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

# ── App icon configuration (flutter_launcher_icons) ─────────────────
flutter_icons:
  android: true
  ios: true
  image_path: "lib/assets/icon.png"
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "lib/assets/icon.png"
  min_sdk_android: 21

# ── Dependencies ─────────────────────────────────────────────────────
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  shared_preferences: ^2.2.2
  video_player: ^2.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

# ── Flutter config ───────────────────────────────────────────────────
flutter:
  uses-material-design: true

  assets:
    - lib/assets/